<!-- pages/bookings.html - User bookings dashboard -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bookings - HomeEase</title>
  <link rel="icon" href="../images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .tab-row { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { padding: 8px 18px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--white); color: var(--navy); font-weight: 600; cursor: pointer; transition: all var(--trans); }
    .tab-btn.active { background: var(--orange); color: #fff; border-color: var(--orange); }
  </style>
</head>
<body>
  <header id="site-header"></header>

  <div class="container">
    <div class="dash-layout">
      <aside class="sidebar">
        <div class="side-title">User Panel</div>
        <a href="user-dashboard.html">Dashboard</a>
        <a href="bookings.html" class="active">My Bookings</a>
        <a href="services.html">Book a service</a>
        <a href="#" onclick="logout();return false;">Logout</a>
      </aside>
      <main>
        <div class="dashboard-header fade-in">
          <h2 class="welcome" id="welcome">My Bookings</h2>
        </div>

        <div class="tab-row">
          <button class="tab-btn active" data-tab="active" onclick="switchTab('active')">Active</button>
          <button class="tab-btn" data-tab="past" onclick="switchTab('past')">Past</button>
        </div>

        <div id="bookings" class="booking-list"></div>
      </main>
    </div>
  </div>

  <div id="footer"></div>

  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/main.js"></script>
  <script>
    if (!requireRole("user")) { /* redirected */ }
    else {
      const current = getCurrentUser();
      document.getElementById("welcome").textContent = "Welcome, " + current.name + "!";

      let activeTab = "active";
      function isActive(status) { return status === "pending" || status === "accepted"; }
      function isPast(status) { return status === "completed" || status === "cancelled"; }

      window.switchTab = function(tab) {
        activeTab = tab;
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
        render();
      };

      function cancelBooking(id) {
        const bookings = getBookings();
        const b = bookings.find(x => x.id === id);
        if (b) { b.status = "cancelled"; saveBookings(bookings); render(); if (typeof showToast === "function") showToast("Booking cancelled.", "info"); }
      }

      function render() {
        const mine = getBookings().filter(b => b.userId === current.id);
        const list = mine.filter(b => activeTab === "active" ? isActive(b.status) : isPast(b.status));
        const container = document.getElementById("bookings");
        if (list.length === 0) {
          container.innerHTML = '<div class="empty-state fade-in">' + icon("inbox", 48) + '<h4>No ' + activeTab + ' bookings</h4><p>' + (activeTab === "active" ? "Book a service to get started." : "Your completed or cancelled bookings will appear here.") + '</p><a href="services.html" class="btn btn-primary btn-sm" style="margin-top:12px">Browse services</a></div>';
        } else {
          container.innerHTML = list.map(b => `
            <div class="booking-item fade-in">
              <h4>${b.service} ${statusBadge(b.status)}</h4>
              <div class="booking-meta">Technician: ${b.technicianName} &nbsp;|&nbsp; Date: ${b.date} ${b.time}</div>
              <div class="booking-meta">Address: ${b.address}</div>
              ${b.status === "pending" ? '<button class="btn btn-sm" style="margin-top:10px;border:1.5px solid var(--line);background:var(--white);color:var(--navy);" onclick="cancelBooking(' + b.id + ')">Cancel</button>' : ""}
            </div>
          `).join("");
        }
        initScrollAnimations();
      }

      render();
    }
  </script>
</body>
</html>
