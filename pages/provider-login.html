<!-- pages/provider-login.html - Service provider login page (redesigned) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Provider Login - HomeEase</title>
  <link rel="icon" href="../images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header id="site-header"></header>
  <div class="auth-split">
    <div class="auth-panel">
      <img src="../images/logo.png" alt="HomeEase logo" class="site-logo">
      <h2>Provider portal</h2>
      <p>Log in to view and manage your booking requests.</p>
      <div class="photo-placeholder"></div>
    </div>
    <div class="auth-form-side">
      <div class="form-card">
        <h2 style="margin-bottom:6px;">Provider Login</h2>
        <p style="color:var(--muted);margin-bottom:20px;font-size:0.9rem;">Enter your credentials to continue.</p>
        <div id="errLogin" class="alert alert-error"></div>
        <form onsubmit="handleProviderLogin(event)">
          <div class="float-group">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder=" ">
          </div>
          <div class="float-group">
            <label for="password">Password</label>
            <div class="input-wrap">
              <input id="password" type="password" placeholder=" ">
              <button type="button" class="toggle-pw" data-icon="eye" data-size="18" onclick="togglePassword('password', this)"></button>
            </div>
          </div>
          <button type="submit" class="btn btn-secondary" style="width:100%">Log In</button>
        </form>
        <p style="text-align:center;margin-top:16px;font-size:0.9rem;">New provider? <a href="provider-signup.html">Create an account</a></p>
      </div>
    </div>
  </div>
  <div id="footer"></div>
  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
