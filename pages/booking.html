<!-- pages/booking.html - Booking form page (redesigned) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book a Service - HomeEase</title>
  <link rel="icon" href="../images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="container">
    <div class="card form-card fade-in">
      <h2 class="section-title" style="font-size:1.6rem;">Book a Service</h2>
      <p class="section-sub" style="margin-bottom:20px;">Fill in the details to schedule your booking.</p>
      <form onsubmit="handleBooking(event)">
        <div class="float-group">
          <label for="service">Service</label>
          <select id="service" onchange="onServiceChange()"></select>
        </div>
        <div class="float-group">
          <label for="technician">Technician</label>
          <select id="technician"></select>
        </div>
        <div class="float-group">
          <label for="date">Date</label>
          <input id="date" type="date">
        </div>
        <div class="float-group">
          <label for="time">Time</label>
          <input id="time" type="time">
        </div>
        <div class="float-group">
          <label for="address">Address</label>
          <textarea id="address" rows="3" placeholder="e.g. Gulshan-e-Iqbal, Karachi"></textarea>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Confirm Booking</button>
      </form>
    </div>
  </div>
  <div id="footer"></div>
  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/main.js"></script>
  <script>
    if (!requireRole("user")) { /* redirected */ }
    else {
      function onServiceChange() {
        populateTechSelect("technician", document.getElementById("service").value);
      }
      function handleBooking(event) {
        event.preventDefault();
        const service = document.getElementById("service").value;
        const techId = document.getElementById("technician").value;
        const date = document.getElementById("date").value;
        const time = document.getElementById("time").value;
        const address = document.getElementById("address").value.trim();
      if (!service || !techId || !date || !time || !address) {
        if (typeof showToast === "function") showToast("Please fill all fields.", "error");
        else alert("Please fill all fields.");
        return;
      }
        const tech = getProviders().find(p => p.id == techId);
        const current = getCurrentUser();
        const booking = {
          id: Date.now(),
          userId: current.id,
          userName: current.name,
          service: service,
          technicianId: tech.id,
          technicianName: tech.name,
          date: date,
          time: time,
          address: address,
          status: "pending"
        };
        const bookings = getBookings();
        bookings.push(booking);
        saveBookings(bookings);
      if (typeof showToast === "function") showToast("Booking saved! Status: pending.", "success");
      else alert("Booking saved! Status: pending.");
      window.location.href = "user-dashboard.html";
      }
      populateServiceSelect("service");
      const params = new URLSearchParams(window.location.search);
      const svc = params.get("service");
      if (svc) {
        const sel = document.getElementById("service");
        for (let i = 0; i < sel.options.length; i++) {
          if (sel.options[i].value === svc) { sel.selectedIndex = i; break; }
        }
      }
      onServiceChange();
    }
  </script>
</body>
</html>
