<!-- pages/user-signup.html - Customer registration page -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Sign Up - HomeEase</title>
  <link rel="icon" href="../images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header id="site-header"></header>
  <div class="auth-split">
    <div class="auth-panel">
      <img src="../images/logo.png" alt="HomeEase logo" class="site-logo">
      <h2>Join HomeEase</h2>
      <p>Create your account and book trusted home professionals in minutes.</p>
      <div class="photo-placeholder"></div>
    </div>
    <div class="auth-form-side">
      <div class="form-card">
        <h2 style="margin-bottom:6px;">Create User Account</h2>
        <p style="color:var(--muted);margin-bottom:20px;font-size:0.9rem;">Fill in your details to get started.</p>
        <form onsubmit="handleUserSignup(event)">
          <div class="float-group">
            <label for="name">Full Name</label>
            <input id="name" type="text" placeholder=" ">
            <div id="errName" class="error-msg"></div>
          </div>
          <div class="float-group">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder=" ">
            <div id="errEmail" class="error-msg"></div>
          </div>
          <div class="float-group">
            <label for="phone">Phone</label>
            <input id="phone" type="tel" placeholder=" ">
            <div id="errPhone" class="error-msg"></div>
          </div>
          <div class="float-group">
            <label for="password">Password</label>
            <div class="input-wrap">
              <input id="password" type="password" placeholder=" ">
              <button type="button" class="toggle-pw" data-icon="eye" data-size="18" onclick="togglePassword('password', this)"></button>
            </div>
            <div id="errPassword" class="error-msg"></div>
          </div>
          <div class="float-group">
            <label for="confirm">Confirm Password</label>
            <div class="input-wrap">
              <input id="confirm" type="password" placeholder=" ">
              <button type="button" class="toggle-pw" data-icon="eye" data-size="18" onclick="togglePassword('confirm', this)"></button>
            </div>
            <div id="errConfirm" class="error-msg"></div>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%">Sign Up</button>
        </form>
        <p style="text-align:center;margin-top:16px;font-size:0.9rem;">Already have an account? <a href="user-login.html">Log in</a></p>
      </div>
    </div>
  </div>
  <div id="footer"></div>
  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
